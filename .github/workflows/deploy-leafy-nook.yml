name: Deploy The Leafy Nook to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "the-leafy-nook/**"
      - ".github/workflows/deploy-leafy-nook.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: the-leafy-nook/package-lock.json

      - name: Install dependencies
        working-directory: the-leafy-nook
        run: npm ci

      - name: Build site
        working-directory: the-leafy-nook
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: the-leafy-nook/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
