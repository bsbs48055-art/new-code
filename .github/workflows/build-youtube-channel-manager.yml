name: Build YouTube Channel Manager (Windows)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'youtube-channel-manager/**'
      - '.github/workflows/build-youtube-channel-manager.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: youtube-channel-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable exe
        run: npm run dist

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-manager-windows
          path: |
            youtube-channel-manager/release/*.exe
            youtube-channel-manager/release/*.exe.blockmap
